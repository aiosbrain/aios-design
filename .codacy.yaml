# Codacy configuration.
#
# pencil-scripts/ holds generator scripts that run inside Pencil's script runtime, not Node
# or a browser. They are required to use a top-level `return` to hand nodes back, and to
# read the injected `pencil` global — both of which a general-purpose JS linter reports as
# errors (observed on PR #19: 3 issues, all of that shape). Rewriting them to satisfy the
# linter would stop them working in the only runtime that ever executes them.
#
# These are design-source generators, not shipped code: they are excluded from the npm
# package by the `files` allowlist in package.json, so nothing here reaches a consumer.
#
# react/test/ is excluded for the same class of reason. Codacy's security rules assume a
# running service; a component test suite is not one. Every finding it raised on PR #23 was
# a READ of `container.innerHTML` in a jsdom assertion — comparing rendered output, never
# assigning it — which is what a component test is supposed to do. Rewriting those to satisfy
# the rule would mean asserting on something other than the rendered markup, i.e. testing less.
# react/tools/ is deliberately NOT excluded: it is tooling that runs in CI, so it stays scanned.
# The suite ships in neither package (`files: ["dist"]`).
---
exclude_paths:
  - "pencil-scripts/**"
  - "react/test/**"
