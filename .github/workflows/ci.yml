name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Design contract + generated tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Runs the same suite under coverage and writes coverage/lcov.info. This is the
      # exact command scan-on-merge.yml invokes to feed the Team Brain's Codebases
      # dashboard, and that workflow calls it with `|| true` — so a break there is
      # silent and coverage quietly reverts to "not reporting". Running it here on
      # every PR is what makes that failure loud.
      #
      # Scope: BOTH published packages. The node run instruments build/** + scripts/**
      # (the executable source of @aios-alpha/design); react/tools/merge-coverage.mjs then
      # runs the @aios-alpha/ui component suite under vitest and appends its lcov records to
      # the same coverage/lcov.info, because the brain's scanner reads that one file and sums
      # every LF/LH record in it. Before that merge existed, this repo reported ~99% coverage
      # over 436 instrumented lines while the React component library — the other package it
      # publishes — had zero tests and was absent from the denominator entirely.
      #
      # Node's built-in coverage, not c8 (aios-workspace's house tool), because both
      # were measured against this suite and the headline agreed exactly: lines 99.08 /
      # functions 100 under each, differing only in branch accounting (80.00 vs 81.82).
      # The one subprocess here (scripts/verify-release-tag.mjs, spawned by
      # design-contract.test.mjs) is captured either way, so c8 would buy nothing and
      # this package ships with zero runtime dependencies. If a future test spawns work
      # the built-in cannot see, re-measure before assuming the number is still honest.
      #
      # Nothing in either suite skips on a missing env var or toolchain: all 15 node tests
      # and all 139 component tests run unconditionally, so the report cannot silently read
      # low on a bare runner. The component runner (vitest + jsdom + Testing Library) is a
      # react/ devDependency only — @aios-alpha/design still ships zero runtime dependencies.
      - run: npm run test:coverage
      - name: Generated brand geometry is committed
        # npm ci ran the brand build; if it moved caret-a-path.ts, the committed
        # copy the React package compiles against had drifted from brand/src.
        run: git diff --exit-code react/components/aios/caret-a-path.ts
      - name: Verify Design publish surface
        run: npm pack --dry-run
      - name: Build UI package
        working-directory: react
        run: |
          npm ci
          npm run build
          npm run check:exports
          npm run typecheck
          npm test
      - name: Verify UI publish surface
        working-directory: react
        run: npm pack --dry-run
