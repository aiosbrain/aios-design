name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Design contract + generated tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generated brand geometry is committed
        # npm ci ran the brand build; if it moved caret-a-path.ts, the committed
        # copy the React package compiles against had drifted from brand/src.
        run: git diff --exit-code react/components/aios/caret-a-path.ts
      - name: Verify Design publish surface
        run: npm pack --dry-run
      - name: Build UI package
        working-directory: react
        run: |
          npm ci
          npm run build
          npm run check:exports
      - name: Verify UI publish surface
        working-directory: react
        run: npm pack --dry-run
